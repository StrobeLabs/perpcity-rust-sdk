permissions:
  contents: read

on:
  push:
    branches: [main]
  # `ready_for_review` is not one of the default activity types, and the
  # jobs below skip drafts — so without it, a draft marked ready with no
  # further commits would never trigger a run to un-skip them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: CI

# Every cargo invocation passes `--locked` (the lockfile is committed, so a
# green run proves it resolves) and `--all-features`. The features are the
# reason for the latter: `test-utils` exposes `history::test_support` to
# downstream test suites and `aws` the KMS signer, so a broken feature gate
# would otherwise ship green.
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: fmt
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    name: clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    name: test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc

  doc:
    runs-on: ubuntu-latest
    name: doc
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  # The public API against the last release: a breaking change is allowed
  # only when the version in Cargo.toml says so (a minor bump before 1.0),
  # so breaking something and bumping the version happen in the same PR.
  semver:
    runs-on: ubuntu-latest
    name: semver
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: baseline
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: perpcity-sdk
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          feature-group: all-features

  # The design graph: every name in every DESIGN.md resolved against
  # rustdoc's JSON, every producer and consumer a table claims verified
  # against a signature, and the root node's invariants. The nightly is
  # pinned to the JSON format `rustdoc-types` in xtask expects; bump the
  # two together.
  design:
    runs-on: ubuntu-latest
    name: design
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    env:
      DESIGN_TOOLCHAIN: nightly-2026-04-23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-23
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask design --check
      # The invariants are proven able to fail: a fixture crate with one
      # planted violation each, documented by the same rustdoc.
      - run: cargo test --locked -p xtask
      # On a pull request, what the change did to the type graph: built at
      # the base too, diffed, and posted to the job summary and as one
      # comment on the PR that later runs update, even when the check or the
      # tests above failed, so the comment is never stale. The diff carries
      # the ratchet: a new island, dead end, two-cycle or unnamed flow that
      # no node acknowledges fails the job, after the comment is posted.
      - if: github.event_name == 'pull_request' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          status=0
          cargo xtask design --diff "origin/$BASE" > design-diff.md || status=$?
          cat design-diff.md >> "$GITHUB_STEP_SUMMARY"
          marker='<!-- design-diff -->'
          { printf '%s\n' "$marker"; cat design-diff.md; } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1 || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null || echo "could not update the PR comment"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null || echo "could not post the PR comment"
          fi
          exit $status
