[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "Repo tooling: the design graph checked against rustdoc's JSON"

[dependencies]
anyhow = "1"
# Pinned to the JSON format the CI nightly emits (`FORMAT_VERSION`); bump
# the two together, see .github/workflows/ci.yml.
rustdoc-types = "=0.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
